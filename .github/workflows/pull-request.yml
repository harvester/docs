name: Pull Request Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 node.js 24

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Set up swap space
        run: |
          sudo fallocate -l 2G /mnt/extra-ci-build.swap
          sudo chmod 600 /mnt/extra-ci-build.swap
          sudo mkswap /mnt/extra-ci-build.swap
          sudo swapon /mnt/extra-ci-build.swap
          free -h
          swapon --show

      - name: Install dependencies
        run: |
          PUPPETEER_DOWNLOAD_BASE_URL=https://storage.googleapis.com/chrome-for-testing-public yarn install --frozen-lockfile

      - name: Build
        run: |
          yarn gen-api-docs
          yarn build

      - name: Show memory usage after build
        if: always()
        run: |
          free -h
          swapon --show

      - name: Upload build to artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build
          path: ./build

      - name: Save PR data to artifact
        run: |
          {
            echo "PR_NUMBER=${{ github.event.pull_request.number }}"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          } > pr-data.env

      - name: Upload PR data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-data
          path: pr-data.env
